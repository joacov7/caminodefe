<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sin conexión · Camino de Fe</title>
<meta name="theme-color" content="#26604f">
<style>
  :root { --bg:#faf7f0; --fg:#1b2a2f; --muted:#55656b; --primary:#26604f; --on:#faf7f0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11171a; --fg:#ece8df; --muted:#a7a198; --primary:#5fae94; --on:#0f1a17; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding:24px; }
  main { max-width:28rem; text-align:center; display:flex; flex-direction:column; align-items:center; gap:18px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size:2rem; margin:0; }
  p { color:var(--muted); line-height:1.6; margin:0; }
  blockquote { font-family: Georgia, serif; font-style:italic; font-size:1.1rem; margin:0; }
  a { background:var(--primary); color:var(--on); text-decoration:none; font-weight:600; padding:12px 22px; border-radius:999px; }
  img { width:56px; height:56px; }
</style>
</head>
<body>
<main>
  <img src="/icon.svg" alt="">
  <h1>Estás sin conexión</h1>
  <p>Los capítulos de la Biblia que ya abriste siguen disponibles. Cuando vuelva la conexión, todo se actualiza solo.</p>
  <blockquote>“Lámpara es á mis pies tu palabra, y lumbrera á mi camino.”<br><small>— Salmos 119:105</small></blockquote>
  <a href="/biblia">Ir a la Biblia</a>
</main>
</body>
</html>
