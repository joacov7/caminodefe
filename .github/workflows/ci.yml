name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Rol dueño NO superusuario (como en Neon) para que la RLS forzada aplique.
      TEST_DATABASE_URL: postgresql://cdf_owner:cdf@localhost:5432/cdf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Preparar base de pruebas (rol no superusuario + migraciones)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "create role cdf_owner login password 'cdf'"
          psql -h localhost -U postgres -c "create database cdf owner cdf_owner"
          DATABASE_DRIVER=pg DATABASE_URL=$TEST_DATABASE_URL npm run db:migrate

      - name: Pruebas (unitarias + integración con Postgres)
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Valores dummy: el build no debe requerir secretos reales.
          NEXT_TELEMETRY_DISABLED: "1"

      - name: E2E — fixtures, app real y Playwright
        env:
          DATABASE_DRIVER: pg
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          AUTH_SECRET: ci-e2e-secret-solo-para-pruebas-0123456789
          AUTH_URL: http://localhost:3100
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
        run: |
          npm run db:fetch-bible
          npx tsx db/import-bible.ts
          npm run e2e:fixtures
          npm i --no-save playwright && npx playwright install --with-deps chromium
          (npx next start -p 3100 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3100/api/health && break; sleep 1; done
          npm run e2e
